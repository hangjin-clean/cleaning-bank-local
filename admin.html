<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>청소뱅크 4호 대량배포</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header>
  <div class="wrap nav">
    <b>청소뱅크 4호 · 대량배포</b>
    <a href="/">메인</a>
  </div>
</header>
<main class="wrap section">
  <h1>전국 키워드 생성 / 8,000개 분할</h1>
  <p>전국 시·군·구 + 동·읍 기준. 면·리·숫자 분동(1동·2동 등)·1가/2가 제외.</p>

  <div class="card" style="max-width:900px">
    <button class="btn" id="countBtn" style="border:0">전체 키워드 계산</button>
    <div id="summary" style="margin:18px 0"></div>

    <label>시작 번호
      <input id="start" type="number" value="1" min="1" style="padding:10px">
    </label>
    <label>개수
      <input id="limit" type="number" value="8000" min="1" max="8000" style="padding:10px">
    </label>
    <button class="btn" id="rangeBtn" style="border:0">구간 확인</button>
  </div>

  <div id="out" class="section"></div>
</main>
<script src="/assets/admin.js"></script>
</body>
</html>
